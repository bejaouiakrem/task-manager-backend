spring.application.name=${APP_NAME:demo}

# Database Properties
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}

# Mail Properties
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT:25}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=${MAIL_PROTOCOL:smtp}

# URLs
send.email.verificationUrl=${VERIFICATION_URL}
ResetPassword.email.verificationUrl=${RESET_PASSWORD_URL}

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration.time=${JWT_EXPIRATION:900000}

# SpringDoc
springdoc.swagger-ui.path=${SWAGGER_PATH:/swagger-ui.html}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.api-docs.path=${API_DOCS_PATH:/v3/api-docs}

# Logging
logging.level.org.springframework.security=${LOG_SECURITY_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${LOG_HIBERNATE_BINDER:TRACE}


